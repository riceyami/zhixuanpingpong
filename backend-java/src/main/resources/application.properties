# 默认激活开发环境配置 (dev)
spring.profiles.active=dev

# 数据库基础配置
spring.datasource.url=jdbc:mysql://localhost:3306/zhuxuan?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 密码从 active profile 或环境变量读取
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis 配置
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 服务端口
server.port=8080

# 日志配置
logging.level.com.zhuxuan=debug

# 阿里云 OSS 配置模板 (真实值在 application-dev.properties 中覆盖)
aliyun.oss.access-key-id=${OSS_KEY_ID}
aliyun.oss.access-key-secret=${OSS_KEY_SECRET}
aliyun.oss.bucket-name=${OSS_BUCKET:zhixuan-video}
aliyun.oss.endpoint=${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}

# JWT 密钥配置 (本地开发默认值，生产通过环境变量覆盖)
zhuxuan.jwt.secret=zhuxuan_secret_key_for_jwt_token_generation_2026
