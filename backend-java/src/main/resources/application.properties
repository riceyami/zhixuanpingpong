# 数据库连接配置
spring.datasource.url=jdbc:mysql://localhost:3306/zhuxuan?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 请将此处改为你刚才输入的密码
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis 配置
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 服务端口
server.port=8080

# 日志配置
logging.level.com.zhuxuan=debug

# JWT 配置
zhuxuan.jwt.secret=zhuxuan_secret_key_for_jwt_token_generation_2026
